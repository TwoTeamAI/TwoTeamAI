<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO (overridden per-page by react-helmet-async) -->
    <title>TwoTeamAI — Have an idea? Let's build it.</title>
    <meta name="description" content="TwoTeamAI is a senior product engineering studio. We build web apps, SaaS platforms, AI-powered solutions and business automation — from idea to production." />
    <meta name="keywords" content="product engineering studio, web development India, SaaS development, AI solutions, React development, Next.js, WhatsApp automation, chatbot development, freelance software development" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="TwoTeamAI" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.country" content="India" />
    <link rel="canonical" href="https://twoteamai.vercel.app/" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:site_name" content="TwoTeamAI" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://twoteamai.vercel.app/" />
    <meta property="og:title" content="TwoTeamAI — Have an idea? Let's build it." />
    <meta property="og:description" content="Senior product engineering studio. Web apps, SaaS, AI solutions & automation — from idea to production." />
    <meta property="og:image" content="https://twoteamai.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TwoTeamAI — Product Engineering Studio" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TwoTeamAI — Have an idea? Let's build it." />
    <meta name="twitter:description" content="Senior product engineering studio. Web apps, SaaS, AI solutions & automation." />
    <meta name="twitter:image" content="https://twoteamai.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="TwoTeamAI — Product Engineering Studio" />

    <!-- Performance: Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Fonts (display=swap prevents render blocking) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
